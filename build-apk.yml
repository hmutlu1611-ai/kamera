name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Zip'i ac
        run: for f in *.zip; do unzip -o "$f"; done
      - name: Ana kamera APK
        working-directory: MakroKamera
        run: gradle :app:assembleDebug
      - name: USB Mikroskop APK
        working-directory: MakroKamera
        continue-on-error: true
        run: gradle :usb:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MakroKamera-apk
          path: |
            MakroKamera/app/build/outputs/apk/debug/*.apk
            MakroKamera/usb/build/outputs/apk/debug/*.apk
