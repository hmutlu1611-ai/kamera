name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Zip'i ac
        run: for f in *.zip; do unzip -o "$f"; done
      - name: APK derle
        working-directory: MakroKamera
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MakroKamera-apk
          path: MakroKamera/app/build/outputs/apk/debug/*.apk
